framework-name: "SigLIP2"
model-name: "siglip2_person_attribute"
pre-label-model: "model/gender-age-1"
model-annotation: "text"
attributes:
  - name: Age
    alias: Usia
    type: single
    indices: [0, 1]
    options: [Kid, Adult]
    option_aliases: ['Anak', 'Dewasa']
  - name: Gender
    alias: Jenis Kelamin
    type: single
    indices: [2, 3, 4]
    options: [Male, Female, Unknown]
    option_aliases: ['Laki-laki', 'Perempuan', 'Tidak Jelas']
  - name: Head
    alias: Kepala
    type: single
    indices: [5, 6, 7, 8, 9]
    options: [None, Hijab, Hat, Helm, Other]
    option_aliases: ['Tidak Ada', 'Hijab', 'Topi', 'Helm', 'Lainnya']
text-format: "path/filename.jpg	0,1,0,1,0,0,0,0,0,0"
export:
  layout: metadata_jsonl
folder:
  structure:
    - train
    - val
    - test
  ratio:
    train: 0.8
    val: 0.1
    test: 0.1
